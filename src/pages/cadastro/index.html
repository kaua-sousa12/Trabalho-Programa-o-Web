<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="../global.css">
</head>

<body>
    <div class="principal">
        <nav class="navbar">
            <div class="logo">TECHSNEAKERS</div>

        </nav>

        <main class="main-content">
            <div class="cadastro-container">
                <h2>Criar conta</h2>

                <form novalidate onsubmit="cadastrarUsuario(event)">
                    <div class="form-group">
                        <input type="text" id="nome" placeholder="Nome Completo">
                    </div>

                    <div class="form-group">
                        <input type="email" id="email" placeholder="Email">
                    </div>

                    <div class="form-group">
                        <input type="text" id="telefone" placeholder="Telefone">
                    </div>

                    <div class="form-group">
                        <input type="text" id="profissao" placeholder="Profissão">
                    </div>

                    <div class="form-group">
                        <input type="password" id="senha" placeholder="Senha">
                    </div>

                    <button class="btn-cadastrar">CADASTRAR</button>
                </form>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        function cadastrarUsuario(event) {
            event.preventDefault();

            let nome = document.getElementById('nome').value;
            let senha = document.getElementById('senha').value;
            let telefone = document.getElementById('telefone').value;
            let profissao = document.getElementById('profissao').value;
            let email = document.getElementById('email').value;

            if (nome == '' || email == '' || senha == '' || telefone == '' || profissao == '') {
                return Swal.fire({
                    icon: 'error',
                    title: 'Erro',
                    text: 'Preencha todos os campos corretamente!'
                });
            }

            let partes = email.split('@');
            let dominio = partes[1];

            if (partes.length != 2 || partes[0] == '' || dominio == '') {
                return Swal.fire({
                    icon: 'error',
                    title: 'Erro',
                    text: 'Preencha o email corretamente!'
                });
            }

            let partesdominio = dominio.split('.');
            if (partesdominio.length < 2 || partesdominio.some(parte => parte == '')) {
                return Swal.fire({
                    icon: 'error',
                    title: 'Erro',
                    text: 'Preencha o email corretamente!'
                });
            }

            let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];

            if (usuarios.some(u => u.email === email)) {
                return Swal.fire({
                    icon: 'error',
                    title: 'Erro',
                    text: 'Este email está cadastrado.'
                });
            }

            usuarios.push({ nome, email, senha, profissao, telefone });
            localStorage.setItem('usuarios', JSON.stringify(usuarios));

            window.location.href = '../login/index.html';
        }
    </script>
</body>

</html>
