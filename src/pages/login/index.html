<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="../global.css">
</head>

<body>
    <div class="principal">
        <nav class="navbar">
            <a class="logo" href="../landing-page/index.html">TECHSNEAKERS</a>
        </nav>

        <main class="main-content">
            <div class="login-container">
                <h2>Login</h2>

                <form novalidate onsubmit="login(event)">
                    <div class="form-group">
                        <input type="email" id="email" placeholder="email" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="senha" placeholder="senha" required>
                    </div>

                    <button class="btn-entrar">ENTRAR</button>
                </form>

                <div class="signup-link">
                    Não tem uma conta? <a href="../cadastro/index.html">Clique aqui</a>
                </div>
            </div>
        </main>
    </div>

    <script>
        function login(event) {
            event.preventDefault();
            let usuario = JSON.parse(localStorage.getItem('usuario'));

            if (!usuario) {
                alert('Nenhum usuário cadastrado.');
                return;
            }

            let emailDigitado = document.getElementById('email').value;
            let senhaDigitada = document.getElementById('senha').value;

            let email = usuario.email;
            let senha = usuario.senha;

            if (email == emailDigitado && senha == senhaDigitada) {
                
                // Salvar no local storage quando o usuario entrar.
                localStorage.setItem('usuarioLogado',JSON.stringify(usuario));
                
                window.location.href = '../landing-page/index.html';
            } else {
                alert('Email ou Senha incorretos.');
            }
        }
    </script>
</body>

</html>
