<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="../global.css">
</head>

<body>
    <div class="box">

        <header class="main-header">

            <a class="logo" href="../landing-page/index.html">TECHSNEAKERS</a>

            <nav class="main-menu">
                <a href="../login/index.html">Login</a>
                <a href="../masculino/index.html">Masculino</a>
                <a href="../feminino/index.html">Feminino</a>
                <a href="../carrinho/index.html">Carrinho(0)</a>
            </nav>

        </header>

        <div class="cart-page">
            <h1 class="cart-title">SEU CARRINHO</h1>
            <div class="cart-container">

                <!-- LISTA DINÂMICA -->
                <div class="items-list">
                </div>

                <!-- RESUMO -->
                <aside class="order-summary">
                    <h2 class="summary-title">Resumo do Pedido</h2>

                    <div class="summary-row">
                        <span>Subtotal (0 itens):</span>
                        <strong>R$</strong>
                    </div>

                    <div class="summary-field">
                        <label>Calcular Frete:</label>

                        <div class="freight-input-group">
                            <input type="text" class="freight-input" placeholder="Digite seu CEP (00000-000)">
                            <button class="btn-calculate-freight" onclick="calcularCep()">CALCULAR</button>
                        </div>
                    </div>

                    <div class="summary-row">
                        <span>Frete:</span>
                        <strong class="freight-price">R$ 00,00 (PAC)</strong>
                    </div>

                    <div class="summary-field">
                        <label>Forma de Pagamento:</label>

                        <div class="summary-select-display">
                            <select>
                                <option>Pix</option>
                                <option>Credito</option>
                                <option>Debito</option>
                                <option>Boleto</option>
                            </select>
                        </div>
                    </div>

                    <div class="summary-total">
                        <span>Total:</span>
                        <strong id ="total-price"></strong>
                    </div>

                    <button class="btn-checkout">FINALIZAR COMPRA</button>

                    <a href="#" class="btn-continue">Continuar Comprando</a>
                </aside>

            </div>
        </div>

        <footer class="main-footer">    
            <span class="copyright">
                © 2024 TECHSNEAKERS.
                Todos os direitos reservados.
            </span>

            <nav class="footer-menu">
                <a href="#">Contato</a>
                <a href="#">Sobre</a>
                <a href="#">Ajuda</a>
            </nav>
        </footer>
    </div>

    <script src="carrinho.js"></script>
</body>

</html>
